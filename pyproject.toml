[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcl"
version = "0.1.0"
description = "Forest canopy loss early warning from Sentinel-1/2 (Frankenwald, Bavaria)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "pystac-client",
    "planetary-computer",
    "odc-stac",
    "rioxarray",
    "geopandas",
]

[project.optional-dependencies]
ml = ["lightgbm", "shap", "scikit-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
